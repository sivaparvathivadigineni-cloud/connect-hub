services:
  - type: web
    name: connect-hub-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: connect-hub-client
    runtime: static
    buildCommand: npm install --prefix client && npm --prefix client run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
